# Runs the code style check and the test suite on every push to main and on every pull request.
# A successful run on main is what makes the Release workflow consider offering a release.

name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Code style & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: fileinfo, zip, mbstring, openssl, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test --compact

      # The Electron sound engine's input decoding and Linux autostart. Uses Node's built-in
      # test runner, so it needs no npm install.
      - name: Run sound engine tests
        run: node --test 'nativephp/electron/src/main/larakey/**/*.test.js'
